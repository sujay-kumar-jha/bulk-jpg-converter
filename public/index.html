<!DOCTYPE html>
<html>
<head>

    <title>Bulk JPG Converter</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
        }

        input[type=file]{
            margin-top:20px;
        }

        button{
            padding:12px 20px;
            margin-top:20px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }

        table{
            width:100%;
            margin-top:30px;
            border-collapse: collapse;
        }

        th, td{
            border:1px solid #ccc;
            padding:10px;
            word-break: break-all;
        }

        th{
            background:#007bff;
            color:white;
        }

        #downloadBtn{
            display:none;
            margin-top:20px;
            display:inline-block;
            padding:12px 20px;
            background:green;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Bulk Image URL to JPG Converter</h2>

<p>
Upload TXT/CSV file containing image URLs (one link per line)
</p>

<input type="file" id="fileInput">

<br>

<button onclick="uploadFile()">
Convert to JPG
</button>

<br>

<a id="downloadBtn" target="_blank">
Download Excel File
</a>

<table>

<thead>
<tr>
<th>Old Link</th>
<th>New JPG Link</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<script>

async function uploadFile(){

    const fileInput =
        document.getElementById("fileInput");

    if(fileInput.files.length === 0){

        alert("Please select a file");

        return;
    }

    const formData = new FormData();

    formData.append(
        "file",
        fileInput.files[0]
    );

    const response = await fetch("/upload",{
        method:"POST",
        body:formData
    });

    const data = await response.json();

    if(!data.success){

        alert("Conversion failed");

        return;
    }

    const tbody =
        document.getElementById("tbody");

    tbody.innerHTML = "";

    data.results.forEach(item=>{

        tbody.innerHTML += `
        <tr>
            <td>${item.oldLink}</td>
            <td>
                <a href="${item.newLink}" target="_blank">
                    ${item.newLink}
                </a>
            </td>
        </tr>
        `;
    });

    const downloadBtn =
        document.getElementById("downloadBtn");

    downloadBtn.style.display = "inline-block";

    downloadBtn.href = data.download;
}

</script>

</body>
</html>
